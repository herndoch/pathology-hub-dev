openapi: 3.1.0
info:
  title: Pathology Hub ELR Tag-Aware Evidence API
  version: 1.6.1-draft
  description: Single-action evidence, lesson, research, and tag-aware search for Pathology Hub. Install only after backend health confirms tag-aware support.
servers:
  - url: https://pathology-hub-v04-vorn5q2kga-uc.a.run.app
paths:
  /evidence/search:
    post:
      operationId: searchEvidence
      summary: Search Pathology Hub evidence sources, with optional tag-aware lookup.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - query
              properties:
                query:
                  type: string
                  description: Text query. May be empty for tag_browse or tag_contents.
                  default: ""
                sources:
                  type: array
                  items:
                    type: string
                    enum: [who, textbooks, journals, pathout, lectures, videos]
                  default: [textbooks]
                search_mode:
                  type: string
                  enum: [auto, vector, keyword, hybrid, tag_browse, tag_contents, tag_then_query]
                  default: auto
                tags:
                  type: array
                  items:
                    type: string
                  description: Primary tag paths or prefixes for tag-aware retrieval.
                  default: []
                tag_match:
                  type: string
                  enum: [exact, prefix, root, any]
                  default: exact
                include_tag_facets:
                  type: boolean
                  default: false
                tag_limit:
                  type: integer
                  minimum: 1
                  maximum: 250
                  default: 50
                tag_offset:
                  type: integer
                  minimum: 0
                  default: 0
                max_results:
                  type: integer
                  minimum: 1
                  maximum: 25
                  default: 5
                include_figures:
                  type: boolean
                  default: false
                max_figures:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 0
                compact:
                  type: boolean
                  default: true
                excerpt_char_limit:
                  type: integer
                  minimum: 200
                  maximum: 4000
                  default: 1200
      responses:
        "200":
          description: Evidence/tag-aware search response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": {description: Bad request}
        "401": {description: Unauthorized}
        "500": {description: Server error}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
