openapi: 3.1.0
info:
  title: Pathology Hub ELR Tag-Aware API
  version: 1.7.0-draft-curriculum-hardening-v11
  description: Draft schema for approved-only curriculum tag retrieval after v11 hardening. Install only after backend health confirms tag-aware support.
servers:
  - url: https://pathology-hub-v04-vorn5q2kga-uc.a.run.app
paths:
  /evidence/search:
    post:
      operationId: searchEvidence
      summary: Search evidence and approved curriculum tags.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [query]
              properties:
                query:
                  type: string
                sources:
                  type: array
                  items:
                    type: string
                    enum: [who, textbooks, pathout, journals, lectures, videos]
                search_mode:
                  type: string
                  enum: [hybrid, vector, fts, tag_auto, tag_exact, tag_prefix, tag_browse]
                infer_tags_from_query:
                  type: boolean
                  default: true
                tags:
                  type: array
                  items:
                    type: string
                tag_prefixes:
                  type: array
                  items:
                    type: string
                return_tag_facets:
                  type: boolean
                  default: true
                max_results:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
                compact:
                  type: boolean
                  default: true
                excerpt_char_limit:
                  type: integer
                  minimum: 200
                  maximum: 4000
                  default: 900
      responses:
        '200':
          description: Evidence/tag-aware response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
